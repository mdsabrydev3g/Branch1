name: Branch1 Mobile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/mobile.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - name: Build web assets without DB migration
        run: npm run build:dev
      - name: Prepare Capacitor shell
        run: |
          rm -rf apps/mobile/www
          mkdir -p apps/mobile/www
          printf '%s\n' '<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body></body></html>' > apps/mobile/www/index.html
      - name: Install Capacitor tooling
        working-directory: apps/mobile
        run: npm install
      - name: Generate Android project
        working-directory: apps/mobile
        run: |
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: branch1-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Build web assets without DB migration
        run: npm run build:dev
      - name: Prepare Capacitor shell
        run: |
          rm -rf apps/mobile/www
          mkdir -p apps/mobile/www
          printf '%s\n' '<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body></body></html>' > apps/mobile/www/index.html
      - name: Install Capacitor tooling
        working-directory: apps/mobile
        run: npm install
      - name: Generate iOS project
        working-directory: apps/mobile
        run: |
          npx cap add ios
          npx cap sync ios
      - name: Archive iOS project
        uses: actions/upload-artifact@v4
        with:
          name: branch1-ios-project
          path: apps/mobile/ios
