name: Branch1 Mobile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/mobile.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - name: Build web assets without DB migration
        run: npm run build:dev
      - name: Prepare Capacitor shell
        run: |
          rm -rf apps/mobile/www
          mkdir -p apps/mobile/www
          printf '%s\n' '<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body></body></html>' > apps/mobile/www/index.html
      - name: Install Capacitor tooling
        working-directory: apps/mobile
        run: npm install
      - name: Generate Android project
        working-directory: apps/mobile
        run: |
          npx cap add android
          npx cap sync android
      - name: Apply F1 app icon
        run: |
          for d in apps/mobile/android-icons/mipmap-*/; do
            cp "$d"*.png "apps/mobile/android/app/src/main/res/$(basename "$d")/"
          done
          cp apps/mobile/android-icons/ic_launcher_background.xml apps/mobile/android/app/src/main/res/values/
      - name: Build debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: branch1-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Build web assets without DB migration
        run: npm run build:dev
      - name: Prepare Capacitor shell
        run: |
          rm -rf apps/mobile/www
          mkdir -p apps/mobile/www
          printf '%s\n' '<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body></body></html>' > apps/mobile/www/index.html
      - name: Install Capacitor tooling
        working-directory: apps/mobile
        run: npm install
      - name: Generate iOS project
        working-directory: apps/mobile
        run: |
          npx cap add ios
          npx cap sync ios
      - name: Apply F1 app icon
        run: |
          ICON_DIR="$(find apps/mobile/ios -type d -name '*.appiconset' -print -quit)"
          if [ -z "$ICON_DIR" ]; then
            ICON_DIR="apps/mobile/ios/App/App/Assets.xcasset/AppIcon.appiconset"
            mkdir -p "$ICON_DIR"
          fi
          cp apps/mobile/ios-icons/AppIcon-512@2x.png "$ICON_DIR/AppIcon-512@2x.png"
      - name: Build unsigned iOS Simulator app
        working-directory: apps/mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Package and upload iOS Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: branch1-ios-simulator
          path: |
            apps/mobile/ios/App/DerivedData/Build/Products/Debug-iphonesimulator/App.app
            apps/mobile/ios
          if-no-files-found: error
      - name: Archive iOS source project
        uses: actions/upload-artifact@v4
        with:
          name: branch1-ios-project
          path: apps/mobile/ios
